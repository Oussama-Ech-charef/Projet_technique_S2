<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de categoriy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">

    <div class="flex min-h-screen">

        <aside class="w-64 bg-slate-900 p-6 text-white">
            <h1 class="mb-8 text-2xl font-bold">Dashboard</h1>

            <nav>
                <a href="#" class="mb-2 block rounded-lg p-3 text-slate-300 hover:bg-slate-800">Tableau de bord</a>
                <a href="#" class="mb-2 block rounded-lg p-3 text-slate-300 hover:bg-slate-800">Article</a>
                <a href="#" class="block rounded-lg bg-orange-500 p-3 font-semibold text-white">Category</a>
            </nav>
        </aside>

        <main class="flex-1 p-6 md:p-10">
            <div class="mb-8 flex flex-wrap items-center justify-between gap-4">
                <div>
                    <h2 class="text-3xl font-bold text-slate-900">Gestion des category</h2>
                </div>

                <button id="btn_nouvelle" class="rounded-lg bg-orange-500 px-5 py-3 font-semibold text-white hover:bg-orange-600">+ Nouveau category</button>
            </div>

            <div id="section_form" class="mb-6 hidden rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
                <h3 class="mb-6 text-xl font-bold">Ajouter un category</h3>

                <form id="form_category">
                    <label for="nom_category" class="mb-2 block">Nom de category :</label>
                    <input type="text" id="nom_category" placeholder="Nom de category..." class="mb-4 w-full rounded-lg border border-slate-300 p-3 outline-none focus:border-orange-500" required>

                    <label for="description" class="mb-2 block">Description de category :</label>
                    <textarea id="description" placeholder="Description de category..." class="mb-4 w-full rounded-lg border border-slate-300 p-3 outline-none focus:border-orange-500" required></textarea>

                    <button type="submit" class="rounded-lg bg-orange-500 px-5 py-2 font-semibold text-white hover:bg-orange-600">Enregistrer</button>
                    <button type="button" id="btn_annuler" class="ml-2 rounded-lg bg-slate-200 px-5 py-2 font-semibold text-slate-700 hover:bg-slate-300">Annuler</button>
                </form>
            </div>

            <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
                <table class="mt-px w-full">
                    <thead class="bg-slate-900 text-white">
                        <tr>
                            <th class="p-4 text-left">ID</th>
                            <th class="p-4 text-left">Nom de category</th>
                            <th class="p-4 text-left">Description</th>
                        </tr>
                    </thead>
                    <tbody id="table_category"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
